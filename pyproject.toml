[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-audit"
version = "0.1.1"
description = "Static security audit for MCP (Model Context Protocol) client configs and server code: leaked tokens, unpinned npx/uvx servers, shell injection, path traversal, SSRF."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Abheesht Tripathi" }]
keywords = ["mcp", "model-context-protocol", "security", "static-analysis", "claude", "cursor", "llm", "ai-agents", "ci"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
mcp-audit = "mcp_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[project.urls]
Homepage = "https://github.com/abhi12337/mcp-audit"
Issues = "https://github.com/abhi12337/mcp-audit/issues"

# Tests for mcp-audit itself.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest
      - name: Scan the demo project (expected to find issues)
        shell: bash
        run: |
          python examples/make_demo.py /tmp/demo-mcp
          mcp-audit scan /tmp/demo-mcp --no-color && exit 1 || test $? -eq 1
      - name: Clean fixtures must pass
        run: mcp-audit scan tests/fixtures/py_clean tests/fixtures/ts_clean --no-color
